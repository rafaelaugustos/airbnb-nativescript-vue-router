dependencies {
    implementation "com.google.android.material:material:1.12.0"
}

android {
    compileSdkVersion 36
    buildToolsVersion "36"
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0"
        generatedDensities = []
    }
    aaptOptions {
        additionalParameters "--no-version-vectors"
    }
}
